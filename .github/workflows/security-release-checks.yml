name: Security release checks
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development, 'prod/**', 'dev/**', 'hotfix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Security, build and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VITE_API_URL: http://127.0.0.1:8123
      VITE_API_KEY: ''
      DATABASE_URL: postgres://test:test@127.0.0.1:1/security_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.21
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Record source and dependency identity
        run: node scripts/security-release-evidence.mjs
      - name: Reject known dependency vulnerabilities
        run: bun audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:security
      - name: Verify dependency locks were not changed
        run: git diff --exit-code -- package.json package-lock.json bun.lock pnpm-lock.yaml src-tauri/Cargo.lock
      - name: Record resolved dependency tree
        run: bun pm ls --all > security-evidence/dependency-tree.txt
      - name: Record dependency vulnerability report
        run: bun audit --json > security-evidence/audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ github.sha }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 90
